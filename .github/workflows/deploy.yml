name: Deploy to VM

on:
  workflow_run:
    workflows: [ "Build and Push Images" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to latest)"
        required: false
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
      DOMAIN: spoontab.com
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile,deploy/config.js,deploy/prometheus.yml,deploy/grafana"
          target: "~/restaurant-pos/deploy"
          strip_components: 1

      - name: Write .env, inject Stripe publishable key, and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/restaurant-pos/deploy

            cat > .env <<EOF
            DOMAIN=${{ env.DOMAIN }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            SUPABASE_DB_HOST=${{ secrets.SUPABASE_DB_HOST }}
            SUPABASE_DB_PORT=${{ secrets.SUPABASE_DB_PORT }}
            SUPABASE_DB_USER=${{ secrets.SUPABASE_DB_USER }}
            SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}
            SUPABASE_DB_NAME=${{ secrets.SUPABASE_DB_NAME }}
            IDENTITY_ADMIN_PASSWORD=${{ secrets.IDENTITY_ADMIN_PASSWORD }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            EOF

            sed -i "s/__STRIPE_PUBLISHABLE_KEY__/${{ secrets.STRIPE_PUBLISHABLE_KEY }}/" config.js

            # Written fresh from the same secret every deploy, so the signing key
            # itself never rotates on its own - previously issued tokens stay valid.
            mkdir -p certs
            cat > certs/identity-signing.cer <<'CERTEOF'
            ${{ secrets.IDENTITY_SIGNING_CERT_PEM }}
            CERTEOF
            cat > certs/identity-signing.key <<'KEYEOF'
            ${{ secrets.IDENTITY_SIGNING_KEY_PEM }}
            KEYEOF
            # 644, not 600: identity's container runs as a non-root appuser (uid 5678),
            # and the bind mount shares host permissions as-is - a root-only-readable
            # file on the host is unreadable to that container user.
            chmod 644 certs/identity-signing.key

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u basnets24 --password-stdin

            docker compose pull
            docker compose up -d
            # A single-file bind mount (./Caddyfile:/etc/caddy/Caddyfile) is bound to
            # the inode that existed at container *start* time. scp replaces the file
            # via rename (a new inode), so a running caddy container silently keeps
            # reading the old file - "caddy reload" against that same stale path is a
            # no-op ("config is unchanged") even though the host file is current and
            # correct. A full container restart re-establishes the bind mount against
            # whatever inode is at that path now, which is the only thing that reliably
            # picks up a Caddyfile edit. Costs ~1-2s of caddy downtime; worth it for
            # correctness over `caddy reload`'s zero-downtime-but-sometimes-silently-stale.
            docker compose restart caddy
            docker image prune -f
